name: Build site

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build from committed derivatives
        run: |
          python build_site.py
          test -f site/index.html
      - name: Check plate embeds resolve
        run: |
          python - <<'PY'
          import csv, re, pathlib
          sources = {r["编号"] for r in csv.DictReader(open("references/sources.csv", encoding="utf-8-sig"))}
          text = "\n".join(p.read_text(encoding="utf-8") for p in pathlib.Path("notes").glob("*.md"))
          slugs = set(re.findall(r"\[\[(?:PLATE|CROP|GRID):([^|\]]+)", text))
          missing = sorted(s for s in slugs if s not in sources)
          assert not missing, missing
          print("ok", len(slugs), "embed slugs")
          PY
